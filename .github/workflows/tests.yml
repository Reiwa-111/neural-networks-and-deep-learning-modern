name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<2.5"
          python -m pip install -e ".[plot,baselines,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile source files
        run: python -m compileall -q src tests fig _smoketest.py

      - name: Lint source and tests
        run: ruff check src tests fig _smoketest.py

      - name: Check formatting
        run: ruff format --check src tests _smoketest.py

      - name: Validate helper scripts
        run: bash -n _smoke.sh _envcheck.sh _gpu_verify.sh _figcheck.sh

      - name: Check CLI installation
        run: nndl --help
